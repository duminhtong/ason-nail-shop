<!DOCTYPE html>

  <link

  <link

  <style>

  <script id="tailwind-config">

        extend: {
          "colors": {

            "surface-container-highest": "#36343a",
            "on-tertiary-fixed": "#241a00",
            "on-tertiary": "#3e2e00",
            "on-secondary-fixed": "#1f1635",
            "secondary-container": "#4d4465",
            "secondary": "#cdc0e9",
            "surface-container-low": "#1d1b20",
            "primary-fixed": "#e9ddff",
            "error-container": "#93000a",
            "surface-tint": "#cfbcff",
            "surface-dim": "#141218",
            "on-primary-container": "#e0d2ff",
            "surface": "#141218",

  <style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface antialiased font-body-md text-body-md pb-xl">
  <!-- TopAppBar -->
  <header
    class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-outline-variant shadow-lg shadow-primary/10">
    <div class="flex justify-between items-center px-gutter py-sm max-w-container-max mx-auto">
      <button
        class="text-on-surface hover:text-primary transition-colors duration-300 md:hidden flex items-center justify-center">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="hidden md:flex gap-md items-center font-label-caps text-label-caps uppercase">
        <a class="text-primary font-bold opacity-80 scale-95 transition-all" href="#">Shop</a>
        <a class="text-on-surface-variant hover:text-primary transition-colors duration-300" href="#">Mood</a>
        <a class="text-on-surface-variant hover:text-primary transition-colors duration-300" href="#">Cart</a>
      </div>
      <div class="font-h2 text-h2 tracking-tighter text-on-surface uppercase text-center flex-1 md:flex-none">A SÓN NAIL
      </div>
      <button
        class="text-on-surface hover:text-primary transition-colors duration-300 flex items-center justify-center">
        <span class="material-symbols-outlined">search</span>
      </button>
    </div>
  </header>
  <main class="pt-[80px] max-w-container-max mx-auto overflow-hidden">
    <!-- Hero Section -->
    <section class="mt-xl px-gutter relative flex flex-col items-center justify-center text-center">
      <h1
        class="font-display-xl text-display-xl uppercase text-transparent bg-clip-text bg-gradient-to-r from-on-surface to-surface-variant z-10 mb-md relative">
        NEON CHIC
        <!-- Neon Glow behind text -->
        <div class="absolute inset-0 bg-primary/20 blur-[60px] -z-10 rounded-full"></div>
      </h1>
      <div
        class="w-full aspect-[4/5] md:aspect-[21/9] rounded-xl overflow-hidden relative border border-outline-variant shadow-[0_0_40px_rgba(207,188,255,0.15)]">
        <img alt="Neon Chic Beauty Hero" class="w-full h-full object-cover object-center"
          data-alt="A striking high-contrast beauty product photography shot featuring a sleek, futuristic cosmetic bottle against a deep, infinite black background. The product is illuminated by intense, dramatic neon purple and pink rim lighting, creating a cyber-luxury aesthetic. The surfaces are high-gloss, reflecting the vibrant neon colors, emphasizing premium quality and advanced cosmetic technology."

          <button
            class="bg-primary text-background font-button text-button px-lg py-sm rounded-full shadow-[0_0_20px_rgba(207,188,255,0.4)] hover:bg-surface-tint transition-all">
            EXPLORE COLLECTION
          </button>
        </div>
      </div>
    </section>
    <!-- Category Chips -->
    <section class="mt-lg px-gutter">
      <div class="flex overflow-x-auto gap-sm hide-scrollbar py-sm">
        <button
          class="flex-shrink-0 px-md py-sm rounded-full font-label-caps text-label-caps border border-primary bg-primary/10 text-primary">ALL</button>
        <button
          class="flex-shrink-0 px-md py-sm rounded-full font-label-caps text-label-caps border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-colors">NAILS</button>
        <button
          class="flex-shrink-0 px-md py-sm rounded-full font-label-caps text-label-caps border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-colors">LIPS</button>
        <button
          class="flex-shrink-0 px-md py-sm rounded-full font-label-caps text-label-caps border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-colors">EYES</button>
        <button
          class="flex-shrink-0 px-md py-sm rounded-full font-label-caps text-label-caps border border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary transition-colors">SKIN</button>
      </div>
    </section>
    <!-- Featured Products Grid -->

      <div class="grid grid-cols-2 md:grid-cols-4 gap-md md:gap-lg">
        <!-- Product Card 1 -->
        <div
          class="flex flex-col group cursor-pointer bg-surface-container rounded-lg border border-outline-variant overflow-hidden hover:border-primary transition-colors duration-300 relative">
          <div

            NEW</div>

            <img alt="Cyber Polish"
              class="w-full h-full object-contain mix-blend-screen group-hover:scale-105 transition-transform duration-500"
              data-alt="A premium glass bottle of nail polish suspended in a dark void. The studio lighting is meticulously controlled, casting a single sharp specular highlight on the glossy black cap. The polish itself glows with an internal luminescent magenta hue, fitting a high-tech cyber-luxury brand identity. Deep shadows provide extreme contrast."

          </div>
          <div class="p-sm flex flex-col gap-xs bg-surface-container border-t border-outline-variant">
            <h3 class="font-button text-button text-on-surface truncate uppercase">Holographic Glaze</h3>
            <div class="font-h3 text-h3 text-primary tracking-tight">$45</div>
          </div>
        </div>
        <!-- Product Card 2 -->
        <div
          class="flex flex-col group cursor-pointer bg-surface-container rounded-lg border border-outline-variant overflow-hidden hover:border-primary transition-colors duration-300">
          <div class="aspect-square bg-surface-dim relative overflow-hidden flex items-center justify-center p-md">
            <img alt="Neon Lipstick"
              class="w-full h-full object-contain mix-blend-screen group-hover:scale-105 transition-transform duration-500"
              data-alt="A sleek, matte black lipstick tube angled dynamically against a pitch-black background. A striking beam of pure neon purple light slashes across the composition, illuminating the vividly pigmented product. The overall mood is aggressive, high-fashion, and technologically advanced, typical of a premium cyber-beauty aesthetic."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuB76gf_lyMMAY5rg4pdsRbZlOkMAjq-egjl-eUoMU2Er6WHR5i74ktF_XLxZi5n6Bp-8PPAOjjq4AGKi9a0AA8JzvG5M0ATB6Xs0eVTqVF0zBAh8Fx46kbp7sSWOS1UTWTo_Gr6Jla6zix-WH7IoF0zeaYhlDA4F_mK5IMwkOmX_KnjfPi92J7371b-q_C2MKZ73Z2oQ4oFHoFC_RNv0lp7h9DrlE89U_f5UaAC84H8TcecuC0Xuavx9kQgxsnLgzgHr8_6loYKxnSA" />
          </div>
          <div class="p-sm flex flex-col gap-xs bg-surface-container border-t border-outline-variant">
            <h3 class="font-button text-button text-on-surface truncate uppercase">Plasma Matte Lip</h3>
            <div class="font-h3 text-h3 text-primary tracking-tight">$38</div>
          </div>
        </div>
        <!-- Product Card 3 -->
        <div
          class="flex flex-col group cursor-pointer bg-surface-container rounded-lg border border-outline-variant overflow-hidden hover:border-primary transition-colors duration-300">
          <div class="aspect-square bg-surface-dim relative overflow-hidden flex items-center justify-center p-md">
            <img alt="Digital Eye Shadow"
              class="w-full h-full object-contain mix-blend-screen group-hover:scale-105 transition-transform duration-500"
              data-alt="An open eyeshadow palette featuring highly reflective metallic and duochrome pigments. The palette sits on a textured dark surface. Cool blue and magenta lighting highlights the granular texture of the pressed powders, making them look like cosmic dust. The visual style is clinical precision combined with vibrant club-culture energy."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5XcrwbZphwDU1WkYZq_Wq3CpEbIG0Mo2SvvRDCSlTXWmlUc6GMPVLAOKHiIS-AAvjUOp1F-Y6oEAQkbUftAAr4DlF6_xHMO9zMjXwOGRQ5qpy25kSdml79Gn3cYstXVeHwNxbirTQA6Pgbv4tDI0duUZ45dkhgPK-kcHn66SQurzOaPLigEvi9a9rLt-gsho3O9aTAR2hNksPLvdQFnwu7zWcGUVZ0dyBHG7tyOSKjewCzQGBgMmbXEKFGKM1B2TK0_JvxpiPD0vt" />
          </div>
          <div class="p-sm flex flex-col gap-xs bg-surface-container border-t border-outline-variant">
            <h3 class="font-button text-button text-on-surface truncate uppercase">Void Shadow Palette</h3>
            <div class="font-h3 text-h3 text-primary tracking-tight">$75</div>
          </div>
        </div>
        <!-- Product Card 4 -->
        <div
          class="flex flex-col group cursor-pointer bg-surface-container rounded-lg border border-outline-variant overflow-hidden hover:border-primary transition-colors duration-300">
          <div class="aspect-square bg-surface-dim relative overflow-hidden flex items-center justify-center p-md">
            <img alt="Cyber Serum"
              class="w-full h-full object-contain mix-blend-screen group-hover:scale-105 transition-transform duration-500"
              data-alt="A minimalist dropper bottle containing a luminous skincare serum. The bottle is presented in an impossibly dark environment, lit from below to emphasize the glowing, viscous fluid inside. The composition is stark and architectural, utilizing deep tonal layering to convey a sense of futuristic, high-performance skincare."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6wiMi9m7T4eagAkVTK33xAGUgL9mZbK3Ryebk9j3G7wBcsZDMnNDzdozT2DBaegsQ2toysIHMMxQg_8LbwzP4CvmgqjFc2iSJrrcglNz_VUWTyEoPSFRkRIz3Hw2EX2WgtiDuS0xJ55uBJflryNhmTWprE65ax_v7sgPt6DxQlPavj9ohK7ZJndhXXAjkyHgtB1HMlhD4NvA2IZUNfNI-YaGyHLRB3bPYU9flzm71DEnc3xPSo7KSciu8D1RVbuFJOnirGe6uw0KM" />
          </div>
          <div class="p-sm flex flex-col gap-xs bg-surface-container border-t border-outline-variant">
            <h3 class="font-button text-button text-on-surface truncate uppercase">Synthetic Glow Serum</h3>
            <div class="font-h3 text-h3 text-primary tracking-tight">$120</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <!-- BottomNavBar -->
  <nav
    class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container/90 backdrop-blur-lg border-t border-outline-variant shadow-[0_-8px_24px_rgba(207,188,255,0.1)]">
    <div class="flex justify-around items-center h-xl px-sm pb-safe">
      <!-- Active Tab: Shop -->
      <button
        class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-2 scale-90 transition-transform">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
        <span class="font-label-caps text-label-caps mt-xs">Shop</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/50 transition-all rounded-xl">
        <span class="material-symbols-outlined">auto_awesome</span>
        <span class="font-label-caps text-label-caps mt-xs">Mood</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/50 transition-all rounded-xl">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="font-label-caps text-label-caps mt-xs">Cart</span>
      </button>
      <button
        class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-bright/50 transition-all rounded-xl">
        <span class="material-symbols-outlined">chat</span>
        <span class="font-label-caps text-label-caps mt-xs">Zalo</span>
      </button>
    </div>
  </nav>

</html>
